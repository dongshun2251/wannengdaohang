<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站中转站</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="toast-container" id="toastContainer"></div>

  <!-- ====== 顶部 ====== -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">&#9672;</span>
      <span class="brand">网站中转站</span>
    </div>
    <div class="header-right">
      <span class="source-tip" id="sourceTip"></span>
      <button class="icon-btn" id="themeSwitchBtn" title="切换主题">&#9789;</button>
    </div>
  </header>

  <!-- ====== Tab 导航 ====== -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="jump"><span class="tab-icon">&#10148;</span><span class="tab-text">跳转台</span></button>
    <button class="tab-btn" data-tab="sites"><span class="tab-icon">&#127760;</span><span class="tab-text">站点管理</span></button>
    <button class="tab-btn" data-tab="config"><span class="tab-icon">&#9881;</span><span class="tab-text">系统配置</span></button>
    <button class="tab-btn" data-tab="json"><span class="tab-icon">&#128196;</span><span class="tab-text">JSON 预览</span></button>
  </nav>

  <!-- ====== Tab 内容区 ====== -->
  <div class="tab-body">

    <!-- Tab 1: 跳转台 -->
    <div class="tab-panel active" id="panel-jump">
      <div class="jump-hero">
        <div class="loader" id="circleLoader"></div>
        <h1>即将跳转至目标站点</h1>
        <p class="subtitle">页面将在 <span class="count-num" id="count-num">10</span> 秒后自动跳转</p>
        <div class="progress-box"><div class="progress-bar" id="progress-bar"></div></div>
      </div>
      <div class="panel-section">
        <h3 class="section-title">选择目标站点</h3>
        <div id="homeDomainWrap" class="site-list"></div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="pauseBtn">暂停倒计时</button>
          <button class="btn btn-primary" id="jumpBtn">立即访问</button>
        </div>
      </div>
    </div>

    <!-- Tab 2: 站点管理 -->
    <div class="tab-panel" id="panel-sites">
      <div class="panel-section" id="loginSection">
        <div class="login-box">
          <h2>&#128274; 管理员登录</h2>
          <div class="form-row"><input type="password" id="adminPwdInput" placeholder="输入管理员密码" class="input"></div>
          <button class="btn btn-primary btn-full" id="loginBtn">登录</button>
        </div>
      </div>
      <div id="sitesContent" style="display:none;">
        <div class="panel-section">
          <h3 class="section-title">&#10010; 新增站点</h3>
          <div class="form-grid">
            <div class="form-row"><input id="siteNameInput" placeholder="站点名称" class="input"></div>
            <div class="form-row"><input id="siteUrlInput" placeholder="https://example.com" class="input"></div>
            <div class="form-row"><input type="number" id="siteWeightInput" value="1" min="0" class="input input-sm" style="max-width:120px"><button class="btn btn-accent btn-sm" id="addSiteBtn">添加</button></div>
          </div>
        </div>
        <div class="panel-section">
          <h3 class="section-title">&#127760; 站点列表</h3>
          <div id="adminDomainWrap" class="admin-site-list"></div>
        </div>
        <div class="panel-section" id="editSection" style="display:none;">
          <h3 class="section-title">&#9998; 编辑站点 <button class="icon-btn btn-close" id="editCloseBtn">&times;</button></h3>
          <input type="hidden" id="editSiteId">
          <div class="form-grid">
            <div class="form-row"><input id="editNameInput" placeholder="站点名称" class="input"></div>
            <div class="form-row"><input id="editUrlInput" placeholder="https://example.com" class="input"></div>
            <div class="form-row"><input type="number" id="editWeightInput" min="0" class="input input-sm" style="max-width:120px" placeholder="权重"></div>
            <div class="form-row"><label class="toggle-label"><input type="checkbox" id="editOpenCheck"><span class="toggle-track"></span><span>站点已开放</span></label></div>
            <div class="form-row"><button class="btn btn-primary btn-sm" id="editSaveBtn">确认修改</button></div>
          </div>
        </div>
        <div class="panel-section">
          <h3 class="section-title">&#128196; 添加内嵌网页</h3>
          <div class="form-grid">
            <div class="form-row"><input id="embNameInput" placeholder="名称" class="input" style="max-width:160px"><input id="embUrlInput" placeholder="https://xxx.com" class="input"><button class="btn btn-accent btn-sm" id="addEmbBtn">添加</button></div>
          </div>
          <div id="embWrap" class="emb-list"></div>
        </div>
      </div>
    </div>

    <!-- Tab 3: 系统配置 -->
    <div class="tab-panel" id="panel-config">
      <div class="panel-section" id="configContent" style="display:none;">
        <div class="config-grid">
          <div class="config-card">
            <h3 class="section-title">&#9881; 基础配置</h3>
            <div class="form-grid">
              <div class="form-item"><label class="field-label">管理员密码</label><input type="password" id="newPwdInput" placeholder="修改密码" class="input"></div>
              <div class="form-item"><label class="field-label">倒计时(秒)</label><input type="number" id="waitSecondInput" min="1" max="60" class="input"></div>
              <div class="form-item"><label class="toggle-label"><input type="checkbox" id="globalNewTabSwitch"><span class="toggle-track"></span><span>新标签打开</span></label></div>
            </div>
          </div>
          <div class="config-card">
            <h3 class="section-title">&#128196; 操作</h3>
            <div class="btn-stack">
              <button class="btn btn-primary btn-full" id="addSaveExportBtn">一键保存并导出</button>
              <button class="btn btn-danger btn-full" id="logoutBtn">登出管理员</button>
            </div>
          </div>
        </div>
      </div>
      <!-- 内嵌网页预览（系统配置内，仅管理员可见） -->
      <section class="embedded-section" id="embeddedSection" style="display:none;">
        <div class="emb-tabs" id="embTabs"></div>
        <div class="emb-frame-wrap" id="embFrameWrap"></div>
      </section>
      <div class="panel-section" id="configLoginHint" style="display:none;">
        <div class="empty-state">
          <p>请先在「站点管理」Tab 中登录管理员</p>
        </div>
      </div>
    </div>

    <!-- Tab 4: JSON 预览 -->
    <div class="tab-panel" id="panel-json">
      <div class="panel-section">
        <div class="json-header">
          <h3 class="section-title">完整配置 JSON <span id="editsBadge" style="display:none;" class="edits-badge">有未导出的修改</span></h3>
          <button class="btn btn-accent btn-sm" id="addSaveExportBtn2">一键保存并导出</button>
        </div>
        <div class="json-box">
          <pre class="json-preview" id="jsonPreview"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js?v=7"></script>
</body>
</html>
